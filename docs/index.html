<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲームチーム分け抽選</title>

  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin:0;
      padding:30px 10px;
      text-align:center;
      background:#f0f0f0;
    }
    h1 {
      font-size:32px;
      margin-bottom:10px;
      color:#333;
    }
    #deadline {
      font-size:18px;
      margin-bottom:20px;
      color:#444;
    }
    #username {
      width:260px;
      padding:8px 10px;
      font-size:16px;
      border:1px solid #ccc;
      border-radius:4px;
      box-sizing:border-box;
      margin-bottom:12px;
    }
    #controls {
      margin-top:12px;
      display:flex;
      justify-content:center;
      gap:8px;
    }
    button {
      padding:10px 16px;
      font-size:16px;
      border:none;
      border-radius:4px;
      cursor:pointer;
      background:#007bff;
      color:#fff;
      transition:background 0.2s;
      width: 260px;
    }
    button:disabled {
      opacity:0.5;
      cursor:not-allowed;
    }
    #wheel {
      width:260px;
      height:260px;
      margin:30px auto;
      border:8px solid #444;
      border-radius:50%;
      background:conic-gradient(#ff4d4d 0deg 90deg, #4d79ff 90deg 180deg, #4dff88 180deg 270deg, #ffd54d 270deg 360deg);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:48px;
      color:#fff;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:transform 4s cubic-bezier(0.33,1,0.68,1);
    }
    #result {
      font-size:22px;
      font-weight:bold;
      margin-top:20px;
      min-height:30px;
      color:#333;
    }
  </style>
</head>
<body>

  <h1>🎡 ゲームチーム分け抽選 🎡</h1>

  <div id="deadline">締切を読み込み中…</div>

  
  <div id="wheel">🎯</div>
  <input id="username" type="text" placeholder="名前を入力">
  <div id="controls">
    <button id="startBtn">抽選を開始</button>
    <!-- button id="resetBtn" style="background:#ff5555;">リセット</button -->
  </div>
  <div id="result"></div>

  <script>
    const API_URL = "https://roulette-api-ffrx.onrender.com";
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const usernameInput = document.getElementById("username");
    const wheel = document.getElementById("wheel");
    const resultBox = document.getElementById("result");
    const deadlineBox = document.getElementById("deadline");

    // ===== 期限読み込み =====
    async function loadDeadline() {
      const res = await fetch(API_URL + "/deadline");
      const data = await res.json();

      const d = new Date(data.deadline);
      deadlineBox.textContent = "締切：" + d.toLocaleString("ja-JP");

      // 締切過ぎてたら無効
      if (new Date() > d) {
        startBtn.disabled = true;
        resultBox.textContent = "抽選は締め切りました";
      }
    }
    loadDeadline();


    // ===== 抽選 =====
    startBtn.addEventListener("click", async () => {
      const name = usernameInput.value.trim();
      if (!name) {
        alert("名前を入力してください！");
        return;
      }

      const rotateDeg = 3600 + Math.random() * 360;
      wheel.style.transform = `rotate(${rotateDeg}deg)`;
      resultBox.textContent = "抽選中…";

      try {
        const res = await fetch(API_URL + "/assign", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });

        const data = await res.json();

        if (data.closed) {
          resultBox.textContent = "抽選は締め切りました";
          startBtn.disabled = true;
          return;
        }

        if (!data.ok) {
          resultBox.textContent = data.error;
          return;
        }

        resultBox.textContent = `あなたのチームは「${data.team}」！`;

        // 抽選後は非活性
        startBtn.disabled = true;

      } catch {
        resultBox.textContent = "通信エラーが発生しました";
      }
    });


    // ===== リセット（見た目だけ） =====
    resetBtn.addEventListener("click", () => {
      wheel.style.transition = "none";
      wheel.style.transform = "rotate(0deg)";
      setTimeout(() => {
        wheel.style.transition = "transform 4s cubic-bezier(0.33,1,0.68,1)";
      }, 50);

      resultBox.textContent = "";
      usernameInput.value = "";
      startBtn.disabled = false;
    });

  </script>
</body>
</html>
