<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ゲームチーム分けルーレット</title>

  <style>
    body {
      font-family: "Arial", sans-serif;
      text-align: center;
      background: #fafafa;
      padding-top: 20px;
      margin: 0;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    #inputArea {
      margin-top: 10px;
    }

    input {
      padding: 8px;
      font-size: 16px;
      width: 160px;
      margin-right: 5px;
    }

    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #2a7cf6;
      color: white;
    }

    #wheel {
      width: 240px;
      height: 240px;
      margin: 30px auto;
      border: 6px solid #333;
      border-radius: 50%;
      line-height: 240px;
      font-size: 40px;
      background: white;
      transition: transform 4s ease-out;
    }

    #result {
      margin-top: 15px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🎡 ゲームチーム分けルーレット</h1>

  <div id="inputArea">
    <input id="username" type="text" placeholder="名前を入力">
    <button id="startBtn">ルーレットを回す</button>
  </div>

  <div id="wheel">🎯</div>

  <div id="result"></div>

  <script>
    const API_URL = "https://roulette-api-ffrx.onrender.com/assign";

    const wheel = document.getElementById("wheel");
    const startBtn = document.getElementById("startBtn");
    const result = document.getElementById("result");

    startBtn.onclick = async () => {
      const name = document.getElementById("username").value.trim();
      if (!name) {
        alert("名前を入力してください！");
        return;
      }

      // 回転アニメーション
      wheel.style.transform = "rotate(" + (3600 + Math.random() * 360) + "deg)";
      result.textContent = "抽選中…";

      // APIへ送信
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });

        const data = await res.json();

        if (!data.ok) {
          result.textContent = data.error;
          return;
        }

        // 結果表示
        result.textContent = `あなたのチームは「${data.team}」！`;
      } catch (e) {
        result.textContent = "通信エラーが発生しました";
      }
    };
  </script>

</body>
</html>
