<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ゲームチーム分けルーレット</title>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin:0;
      padding:30px 10px;
      text-align:center;
      background:#f0f0f0;
    }
    h1 {
      font-size:32px;
      margin-bottom:20px;
      color:#333;
    }
    h1::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 100%;
        height: 3px;
        background: linear-gradient(to right, #4caf50, #87b7ff);
        border-radius: 2px;
    }
    #username {
      width: 260px;
      font-size: 18px;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing:border-box;
      margin-bottom:12px;
      box-sizing: border-box;
    }
    #controls {
      margin-top:12px;
      display:flex;
      justify-content:center;
      gap:8px;
      flex-direction: column;
      align-items: center;
    }
    button {
      padding:10px 16px;
      font-size:16px;
      border:none;
      border-radius:4px;
      cursor:pointer;
      background:#007bff;
      color:#fff;
      transition:background 0.2s;
      width:260px;
    }
    button:hover {
      background:#0056b3;
    }
    #wheel {
      width:260px;
      height:260px;
      margin:30px auto;
      border:8px solid #444;
      border-radius:50%;
      background:conic-gradient(#ff4d4d 0deg 90deg, #4d79ff 90deg 180deg, #4dff88 180deg 270deg, #ffd54d 270deg 360deg);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:48px;
      color:#fff;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:transform 4s cubic-bezier(0.33,1,0.68,1);
    }
    #result {
      font-size:22px;
      font-weight:bold;
      margin-top:20px;
      min-height:30px;
      color:#333;
    }
  </style>
</head>
<body>

  <h1>🎡 ゲームチーム分けルーレット 🎡</h1> 

  <div id="wheel">🎯</div>

  <input id="username" type="text" placeholder="名前を入力">

  <div id="controls">
    <button id="startBtn">抽選をする</button>
    <button id="resetBtn" style="background:#ff5555;">名前をリセット</button>
  </div>

  <div id="result"></div>

  <script>
    const API_URL = "https://roulette-api-ffrx.onrender.com/assign";

    const wheel = document.getElementById("wheel");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const usernameInput = document.getElementById("username");
    const resultBox = document.getElementById("result");

startBtn.addEventListener("click", async () => {
  const name = usernameInput.value.trim();
  if (!name) {
    alert("名前を入力してください！");
    return;
  }

  const rotateDeg = 3600 + Math.random() * 360;
  wheel.style.transform = `rotate(${rotateDeg}deg)`;
  resultBox.textContent = "抽選中…";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    const data = await res.json();

    if (!data.ok) {
      resultBox.textContent = data.error;
      return;
    }

        resultBox.textContent = `あなたのチームは「${data.team}」！`;

        // ★ 抽選後にボタンを非活性化
        startBtn.disabled = true;
        startBtn.style.opacity = "0.5";
        startBtn.style.cursor = "not-allowed";
        
      } catch (e) {
        resultBox.textContent = "通信エラーが発生しました";
      }
    });

    resetBtn.addEventListener("click", () => {
      wheel.style.transition = "none";
      wheel.style.transform = "rotate(0deg)";
      setTimeout(() => {
        wheel.style.transition = "transform 4s cubic-bezier(0.33,1,0.68,1)";
      }, 50);
      resultBox.textContent = "";
      usernameInput.value = "";
    });
  </script>

</body>
</html>
