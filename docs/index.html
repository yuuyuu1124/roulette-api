<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ゲームチーム分けルーレット</title>

  <style>
body {
  font-family: "Arial", sans-serif;
  text-align: center;
  margin: 0;
  padding: 40px 10px;
  background: #fafafa;
}

/* ルーレット */
#wheel {
  width: 240px;
  height: 240px;
  margin: 0 auto 25px auto;
  border: 6px solid #333;
  border-radius: 50%;
  background: conic-gradient(
    #ffe9a3 0deg 90deg,
    #ff8b8b 90deg 180deg,
    #8effbe 180deg 270deg,
    #87b7ff 270deg 360deg
  );
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

/* 入力＋ボタン縦並び */
.control-area {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;  /* ← 自動的に均等な余白 */
}

/* 入力欄 */
.control-area input {
  width: 260px;
  font-size: 18px;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

/* ボタン共通 */
.control-area button {
  width: 260px;
  padding: 10px 12px;
  font-size: 18px;
  border-radius: 6px;
  border: none;
  color: #fff;
  cursor: pointer;
  transition: 0.2s;
}

/* 回すボタン */
#startBtn {
  background: #46a452;
}
#startBtn:hover {
  background: #3c8a47;
}

/* リセットボタン */
#resetBtn {
  background: #ff6b6b;
}
#resetBtn:hover {
  background: #e85c5c;
}

/* 結果表示 */
#result {
  margin-top: 25px;
  font-size: 24px;
  font-weight: bold;
  min-height: 32px;
}
/* タイトル */
.title {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 25px;
  color: #333;
  text-align: center;

  /* 装飾ライン */
  position: relative;
  display: inline-block;
  padding-bottom: 8px;
}

.title::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 3px;
  background: linear-gradient(to right, #4caf50, #87b7ff);
  border-radius: 2px;
}

  </style>
</head>

<body>

  <h1>🎡 ゲームチーム分けルーレット</h1>

  <div id="inputArea">
    <input id="username" type="text" placeholder="名前を入力">
    <button id="startBtn">ルーレットを回す</button>
  </div>

  <div id="wheel">🎯</div>

  <div id="result"></div>

  <script>
    const API_URL = "https://roulette-api-ffrx.onrender.com/assign";

    const wheel = document.getElementById("wheel");
    const startBtn = document.getElementById("startBtn");
    const result = document.getElementById("result");

    startBtn.onclick = async () => {
      const name = document.getElementById("username").value.trim();
      if (!name) {
        alert("名前を入力してください！");
        return;
      }

      // 回転アニメーション
      wheel.style.transform = "rotate(" + (3600 + Math.random() * 360) + "deg)";
      result.textContent = "抽選中…";

      // APIへ送信
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });

        const data = await res.json();

        if (!data.ok) {
          result.textContent = data.error;
          return;
        }

        // 結果表示
        result.textContent = `あなたのチームは「${data.team}」！`;
      } catch (e) {
        result.textContent = "通信エラーが発生しました";
      }
    };
  </script>

</body>
</html>
